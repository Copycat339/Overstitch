<!DOCTYPE html>
<html lang="es">
<head>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Overstitch</h1>
    <nav>
      <ul>

        <li><a href="#">Productos</a></li>
        <li><a href="#">Personaliza</a></li>
        <li><a href="#">Contacto</a></li>
      </ul>

  <main>
    <section class="hero">
      <h2>Ropa Oversize Personalizada</h2>
